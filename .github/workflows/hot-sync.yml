name: Hot Sync (High-Priority Demand)

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max medicines to sync'
        type: number
        default: 250

permissions:
  contents: read

jobs:
  hot-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python-scraper/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        working-directory: python-scraper
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium (with system deps)
        run: playwright install --with-deps chromium

      - name: Run Hot Sync
        working-directory: python-scraper
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          LIMIT=${{ inputs.limit || 250 }}
          python scheduled_runner.py --mode hot --limit $LIMIT --no-dedup

      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hot-sync-log
          path: python-scraper/scheduler.log
          retention-days: 7
